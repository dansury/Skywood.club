<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Статус заказа — Skywood</title>
<link rel="icon" href="/assets/img/logo-round.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .result{max-width:520px;width:100%;background:var(--bg-2);border:1px solid var(--line);
    border-radius:var(--radius);padding:46px 38px;text-align:center}
  .result__icon{font-size:4rem;margin-bottom:14px}
  .result h1{font-size:1.7rem;margin-bottom:12px}
  .result p{color:var(--muted);margin-bottom:8px}
  .result__id{font-family:'Unbounded',sans-serif;font-weight:700;color:var(--accent);
    font-size:1.1rem;margin:6px 0 22px}
  .result .btn{margin-top:10px}
  .result__logo{height:38px;margin:0 auto 26px}
</style>
</head>
<body>
<div class="result" id="result">
  <img class="result__logo" src="/assets/img/logo-white.png" alt="Skywood">
  <div class="result__icon" id="icon">⏳</div>
  <h1 id="title">Проверяем заказ…</h1>
  <div class="result__id" id="orderId"></div>
  <p id="text">Минутку, уточняем статус оплаты.</p>
  <a href="/" class="btn btn--primary" id="homeBtn">На главную</a>
</div>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const orderId = params.get('order') || '';
  const demo = params.get('demo') === '1';
  const fail = location.pathname.includes('/fail');
  const $ = (id) => document.getElementById(id);
  if (orderId) $('orderId').textContent = 'Заказ № ' + orderId;

  const set = (icon, title, text) => {
    $('icon').textContent = icon;
    $('title').textContent = title;
    $('text').textContent = text;
  };

  if (fail) {
    set('⚠️', 'Оплата не прошла', 'Платёж отклонён или отменён. Вы можете оформить заказ заново — товар сохранён.');
    return;
  }

  let order = null;
  if (orderId) {
    try { order = await fetch('/api/orders/' + encodeURIComponent(orderId)).then((r) => r.ok ? r.json() : null); } catch {}
  }

  if (demo) {
    set('🌲', 'Заказ оформлен (демо)', 'Это демонстрационный режим без реальной оплаты. Подключите доступы Т-Банк в .env для боевого режима.');
  } else if (order && order.paymentMethod === 'cod') {
    set('🌲', 'Заказ принят!', 'Оплата при получении: вы оплатите заказ в пункте выдачи или курьеру СДЭК. Мы свяжемся с вами для подтверждения.');
  } else if (order && (order.status === 'paid' || order.payment?.status === 'CONFIRMED')) {
    set('✅', 'Оплата прошла успешно!', 'Спасибо за заказ. Мы отправим палатку со склада СДЭК и пришлём трек-номер.');
  } else {
    set('🌲', 'Заказ оформлен!', 'Если вы оплатили картой — статус обновится в течение пары минут. Мы свяжемся с вами для подтверждения.');
  }
})();
</script>
</body>
</html>
